<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업무포털</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><i>교</i>경상남도교육청</div>
  <div class="me"><div class="av">홍</div><div><b>홍길동 선생님</b><small>○○초등학교 · 교무부</small></div></div>
  <section class="quick" aria-label="업무바로가기">
    <h3>업무바로가기</h3>
    <div class="grid" id="quick"></div>
  </section>
  <div class="timer"><span>자동 로그아웃 <b id="tm">58:57</b></span><button id="ext">연장</button></div>
</aside>
<button class="fold" id="fold" aria-label="사이드바 접기/펼치기">‹</button>

<main>
  <div class="top">
    <span class="search"><input id="q" placeholder="사용자 이름" aria-label="사용자 검색"><button id="go" aria-label="검색">검색</button></span>
    <span>글꼴크기</span>
    <button id="fp" aria-label="글꼴 키우기">＋</button><button id="f0" aria-label="글꼴 기본">↺</button><button id="fm" aria-label="글꼴 줄이기">－</button>
    <button id="dk">다크모드</button>
  </div>

  <nav class="sys" role="tablist" id="sys"></nav>

  <div class="row">
    <section class="approve" aria-label="나이스 승인사항">
      <header><h2 id="apTitle">나이스 승인사항</h2><button id="rf" aria-label="새로고침" style="color:#fff;font-size:1.2em">↻</button></header>
      <div class="cols" id="ap"></div>
    </section>
    <section class="hero"><small id="heroSub">나이스 업무의 시작</small><h1>업무포털</h1></section>
  </div>

  <div class="row">
    <section class="card">
      <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="notice">공지사항</button><button role="tab" aria-selected="false" data-t="todo">나의할일<span class="badge" id="todoN">0</span></button></div>
      <div id="noticeView">
        <div class="filters" id="flt"><a href="#" id="more">more +</a></div>
        <ul class="list" id="nl"></ul>
      </div>
      <div id="todoView" hidden>
        <ul class="list" id="tl"></ul>
        <div class="todo-empty" id="te" hidden>할 일이 없습니다.</div>
        <form id="tf" style="display:flex;gap:6px;margin-top:10px" onsubmit="return false">
          <input id="ti" placeholder="새 할 일 입력" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit">
          <button id="ta" style="background:var(--blue);color:#fff;border-radius:8px;padding:0 14px">추가</button>
        </form>
      </div>
    </section>
    <section class="banner"><div><div class="stack" style="align-items:center"><span></span><span></span><span></span></div><h2 style="margin:0">함께 만드는 스마트 교육</h2><p>업무는 가볍게, 수업은 깊게</p></div></section>
  </div>

  <div class="row">
    <section class="card"><h3><span>나이스 오류사항 안내</span><a href="#" class="mr" style="font-size:.8em;color:var(--text);text-decoration:none">more +</a></h3><ul class="list" id="el"></ul></section>
    <section class="card"><h3><span>나이스 개선사항 안내</span><a href="#" class="mr" style="font-size:.8em;color:var(--text);text-decoration:none">more +</a></h3><ul class="list" id="il"></ul></section>
  </div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
